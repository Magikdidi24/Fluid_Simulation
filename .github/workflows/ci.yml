name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 24.04 has no SDL3 package, Fedora does.
    container: fedora:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dnf install -y gcc make SDL3-devel libasan
      - run: make
      - run: make test
